[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfsmith"
version = "0.1.0"
description = "Swiss-army CLI for PDFs: merge, split, compress and images-to-PDF. Everything local — no uploads, no watermarks, no limits."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Krrish" }]
keywords = ["pdf", "cli", "merge", "split", "compress", "images-to-pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf>=5",
    "Pillow>=10",
]

[project.urls]
Homepage = "https://github.com/codewithkrrish/pdfsmith"
Issues = "https://github.com/codewithkrrish/pdfsmith/issues"

[project.scripts]
pdfsmith = "pdfsmith.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
